<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>404 - Silnik Zgasł</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .error-container {
      max-width: 600px;
      padding: 40px;
    }
    h1 {
      font-size: 80px;
      margin: 0;
      background: linear-gradient(90deg, #ef4444, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    h2 {
      font-size: 28px;
      color: #f8fafc;
      margin: 10px 0 20px 0;
    }
    p {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .start-btn {
      display: inline-block;
      padding: 14px 32px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
    }
    .start-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
    }
    .check-engine {
      font-size: 64px;
      margin-bottom: 20px;
      color: #f59e0b;
      animation: blink 1.5s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="error-container">
    <div class="check-engine">⚠️</div>
    <h1>404</h1>
    <h2>Silnik zgasł!</h2>
    <p>Wygląda na to, że zjechałeś z wyznaczonej trasy. Strona, której szukasz, nie istnieje (może urwało się zawieszenie albo zabrakło paliwa?).</p>
    
    <a href="index.html" class="start-btn">Opal silnik ponownie (Strona główna)</a>
  </div>
</body>
</html>
