<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>AI Modeler Sandbox</title>
  <style>
    body { margin: 0; overflow: hidden; background: #222; font-family: system-ui, sans-serif; }
    #ui-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 8px; z-index: 100; max-width: 300px; }
    button { background: #444; color: white; border: none; padding: 8px 12px; margin: 5px 0; border-radius: 4px; cursor: pointer; width: 100%; }
    button:hover { background: #666; }
    .back-btn { background: #f59e0b; font-weight: bold; }
    .back-btn:hover { background: #d97706; }
  </style>
</head>
<body>
  <div id="ui-panel">
    <h3>🛠️ AI Modeler Sandbox</h3>
    <p style="font-size: 12px; color: #aaa;">Tryb do testowania proporcji i kształtów przez asystenta AI bez niszczenia głównej sceny.</p>
    <button id="btn-spawn-box">Test: Dodaj Box</button>
    <button id="btn-spawn-cyl">Test: Dodaj Cylinder</button>
    <button id="btn-clear">Wyczyść</button>
    <hr style="border: 1px solid #444; margin: 10px 0;">
    <button class="back-btn" onclick="window.location.href='/'">🔙 Wróć do Głównej Aplikacji</button>
  </div>
  <div id="sandbox-container"></div>
  <script type="module" src="/src/sandbox.ts"></script>
</body>
</html>
